services:
  cure-db-container:
    image: postgres
    container_name: cure-db-container
    networks:
      - cure-net
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=secret
      - POSTGRES_DB=cure_db
    volumes:
      - cure-pg-data:/var/lib/postgresql
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d cure_db" ]
      interval: 10s
      timeout: 5s
      retries: 5

  cure-server-container:
    container_name: cure-server-container
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      cure-db-container:
        # ← বাগ ১ ঠিক
        condition: service_healthy
        restart: true
    networks:
      - cure-net
    env_file: .env
    environment:
      CHOKIDAR_USEPOLLING: "1" # ← বাগ ২ ঠিক
      CHOKIDAR_INTERVAL: "300"
    ports:
      - "5000:5000" # ← বাগ ৩: app-এর আসল পোর্ট দাও
    working_dir: /app
    volumes:
      - ./:/app
      - server-node-modules:/app/node_modules
    command: sh -c "CI=true pnpm install && pnpm generate && pnpm prisma migrate deploy && pnpm dev"

networks:
  cure-net:
    name: cure-net

volumes:
  cure-pg-data:
  server-node-modules:
